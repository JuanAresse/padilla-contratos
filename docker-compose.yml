services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio_contracts
      MYSQL_USER: ${DB_USER:?Generate local configuration first}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate local configuration first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate local configuration first}
    volumes:
      - local_database:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      DB_HOST: db
      DB_NAME: portfolio_contracts
      DB_USER: ${DB_USER:?Generate local configuration first}
      DB_PASSWORD: ${DB_PASSWORD:?Generate local configuration first}
      OPERATOR_USER: ${OPERATOR_USER:?Generate local configuration first}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Generate local configuration first}
      OCR_WARMUP: "false"
    volumes:
      - local_uploads:/portfolio/backend/storage
volumes:
  local_database:
  local_uploads:
